[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-updater"
version = "0.1.0"
description = "Secure Python 3 Homelab Updater Webhook Daemon Service"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Homelab Maintainer" }
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "httpx"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]

[project.scripts]
homelab-updater = "src.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
